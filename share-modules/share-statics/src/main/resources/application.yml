server:
  port: 9505

spring:
  application:
    # 应用名称
    name: share-statics
  profiles:
    # 环境配置
    active: dev
  main:
    allow-bean-definition-overriding: true #当遇到同样名字的时候，是否允许覆盖注册
  cloud:
    bus:
      enabled: false
    nacos:
      discovery:
        # 服务注册地址
        server-addr: localhost:8848
